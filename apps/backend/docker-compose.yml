version: '3.8'

services:
  # ============================================================================
  # Backend Services
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: crypto-knowledge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_knowledge
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432' # Port 5433 to avoid conflict with Firecrawl's PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto-knowledge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - crypto-network

  # ============================================================================
  # Firecrawl Services (Web Scraping)
  # ============================================================================
  # Note: Firecrawl is deployed as a separate service.
  # Clone and run from: https://github.com/mendableai/firecrawl
  #
  # Quick setup:
  #   git clone https://github.com/mendableai/firecrawl.git
  #   cd firecrawl
  #   docker-compose up -d
  #
  # The backend connects to Firecrawl API at: http://localhost:3002
  # Configure via FIRECRAWL_API_URL in .env

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  crypto-network:
    driver: bridge
